schemaVersion: 1.0.0
providers:
  - provider: InventoryAsCode
    version: 1.0.0
    metadata:
      isProduction: true
      accountableOwners:
        service: e61713e1-3ecf-42af-ab37-9111c5413102
      routing:
        defaultAreaPath:
          org: msdyneng
          path: FinOps\Retail and Services\Store Commerce Framework

  - provider: Ownership/CodeReviewers
    version: 1.0.0
    metadata:
      options:
        allowInheritance: true
      reviewers:

        # Default branch policies (refs/heads/main)

        # Policy 101076: BAG IE intl PR approvers
        - branches: '[Ref] refs/heads/main'
          scope: |
            [Glob] **/*.lcl;
            **/*.lss;
            **/*.lci;
            **/*.resx
          notifyOnly: [BAGintlPR]

        # Policy 55897: D365 Commerce Core CR Engineering Systems
        - branches: '[Ref] refs/heads/main'
          scope: |
            [Glob] /nuget.config;
            /repo.props
          required: [d365cccres]

        # Policy 362593: D365 Commerce Core CR Price and Discount
        - branches: '[Ref] refs/heads/main'
          scope: |
            [Glob] /src/PricingEngine/**;
            !**/*.lcl;
            !**/*.lss;
            !**/*.lci;
            !**/*.resx
          required: [d365cccrpricing]

        # Policy 604684: D365 Commerce CR Store Commerce Framework
        - branches: '[Ref] refs/heads/main'
          scope: |
            [Glob] /src/FiscalIntegration/**;
            !**/*.lcl;
            !**/*.lss;
            !**/*.lci;
            !**/*.resx
          required: [D365CCRSCF]

        # Policy 158650: D365 Commerce Engineering FTEs
        - branches: '[Ref] refs/heads/main'
          scope: |
            [Glob] **/*;
            !**/*.lcl;
            !**/*.lss;
            !**/*.lci;
            !**/*.resx
          required: [d365ccengftes]

        # Policy 453922: D365 Commerce SDK and App Publishing Admins
        - branches: '[Ref] refs/heads/main'
          scope: |
            [Glob] **/*;
            !**/*.lcl;
            !**/*.lss;
            !**/*.lci;
            !**/*.resx
          required: [d365commpub]

        # Release branch policies (refs/heads/release/*)

        # Policy 94604: BAG IE intl PR approvers
        - branches: '[Prefix] release/'
          scope: |
            [Glob] **/*.lcl;
            **/*.lss;
            **/*.lci;
            **/*.resx
          notifyOnly: [BAGintlPR]

        # Policy 87697: D365 Commerce Core Shiproom Approvers
        - branches: '[Prefix] release/'
          scope: |
            [Glob] **/*;
            !**/*.lcl;
            !**/*.lss;
            !**/*.lci;
            !**/*.resx
          required: [d365ccshiproomapprov]

        # Policy 87698: D365 Commerce Release PR Approvers
        - branches: '[Prefix] release/'
          scope: |
            [Glob] **/*;
            !**/*.lcl;
            !**/*.lss;
            !**/*.lci;
            !**/*.resx
          required: [d365cprapprovers]
